<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔐 SecureAuth 2FA</h1>
    </header>

    <nav>
      <a href="{{ url_for('home') }}" class="nav-btn">Home</a>
      <a href="{{ url_for('register') }}" class="nav-btn active">Register</a>
      <a href="{{ url_for('login') }}" class="nav-btn">Login</a>
    </nav>

    <div class="page">
      <h2>Create Account</h2>
      <form method="POST" action="{{ url_for('register') }}">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="email" name="email" placeholder="Email (for Email OTP)" required>
        <button type="submit">Register</button>
      </form>

      {% if message %}
        <div class="result {{ 'error' if error else 'success' }}">
          {{ message }}
        </div>
      {% endif %}
    </div>
  </div>
</body>
</html>
